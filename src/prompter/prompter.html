<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>pmptr prompter</title>
    <link rel="stylesheet" href="prompter.css" />
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="read-area" id="readArea">
        <div class="track" id="track">
          <div class="pad" id="padTop"></div>
          <pre class="text" id="text"></pre>
          <div class="pad" id="padBottom"></div>
        </div>
        <div class="reading-line" id="readingLine" aria-hidden="true"></div>
        <div class="fade top" aria-hidden="true"></div>
        <div class="fade bottom" aria-hidden="true"></div>
      </div>

      <div class="hud" id="hud" data-locked="false">
        <button
          id="btnPlay"
          class="hud-btn"
          title="Play / Pause (Space)"
          aria-label="Play or pause"
        >
          <svg id="iconPlay" class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6.5 4.75a.75.75 0 0 0-.75.75v9a.75.75 0 0 0 .75.75h1.75a.75.75 0 0 0 .75-.75v-9a.75.75 0 0 0-.75-.75H6.5Zm5.25 0a.75.75 0 0 0-.75.75v9c0 .414.336.75.75.75H14a.75.75 0 0 0 .75-.75v-9a.75.75 0 0 0-.75-.75h-2.25Z"
            />
          </svg>
        </button>
        <button
          id="btnReset"
          class="hud-btn"
          title="Reset (R)"
          aria-label="Reset scroll"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M10 3.25a6.75 6.75 0 1 0 6.48 8.55.75.75 0 1 0-1.44-.42A5.25 5.25 0 1 1 10 4.75v1.69l2.22-2.22a.75.75 0 0 0 0-1.06L10 1.0V3.25Z"
            />
          </svg>
        </button>
        <button
          id="btnVoice"
          class="hud-btn"
          title="Voice follow - scroll with your voice (V)"
          aria-label="Toggle voice follow"
          aria-pressed="false"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M10 2a2.5 2.5 0 0 0-2.5 2.5v5a2.5 2.5 0 0 0 5 0v-5A2.5 2.5 0 0 0 10 2Z"
            />
            <path
              fill="currentColor"
              d="M5.75 8.75a.75.75 0 0 1 .75.75 3.5 3.5 0 0 0 7 0 .75.75 0 0 1 1.5 0 5 5 0 0 1-4.25 4.94v2.06h1.75a.75.75 0 0 1 0 1.5h-5a.75.75 0 0 1 0-1.5h1.75v-2.06A5 5 0 0 1 5 9.5a.75.75 0 0 1 .75-.75Z"
            />
          </svg>
        </button>
        <button
          id="btnLock"
          class="hud-btn"
          title="Lock - click-through (L)"
          aria-label="Toggle click-through lock"
          aria-pressed="false"
        >
          <svg
            id="iconLock"
            class="icon"
            viewBox="0 0 20 20"
            aria-hidden="true"
            data-state="open"
          >
            <path
              class="lock-open"
              fill="currentColor"
              d="M6.75 7.5V6a3.25 3.25 0 0 1 6.42-.75.75.75 0 0 0 1.48-.24A4.75 4.75 0 0 0 5.25 6v1.5H5A1.75 1.75 0 0 0 3.25 9.25v6A1.75 1.75 0 0 0 5 17h10a1.75 1.75 0 0 0 1.75-1.75v-6A1.75 1.75 0 0 0 15 7.5H6.75Zm-1.5 1.5H15c.138 0 .25.112.25.25v6a.25.25 0 0 1-.25.25H5a.25.25 0 0 1-.25-.25v-6c0-.138.112-.25.25-.25Z"
            />
            <path
              class="lock-closed"
              fill="currentColor"
              d="M6.75 7.5V6a3.25 3.25 0 1 1 6.5 0v1.5H15A1.75 1.75 0 0 1 16.75 9.25v6A1.75 1.75 0 0 1 15 17H5a1.75 1.75 0 0 1-1.75-1.75v-6A1.75 1.75 0 0 1 5 7.5h1.75Zm1.5 0h3.5V6a1.75 1.75 0 1 0-3.5 0v1.5ZM5 9h10a.25.25 0 0 1 .25.25v6a.25.25 0 0 1-.25.25H5a.25.25 0 0 1-.25-.25v-6A.25.25 0 0 1 5 9Z"
            />
          </svg>
        </button>
        <button
          id="btnClose"
          class="hud-btn"
          title="Close (Esc)"
          aria-label="Close prompter"
        >
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5.47 5.47a.75.75 0 0 1 1.06 0L10 8.94l3.47-3.47a.75.75 0 1 1 1.06 1.06L11.06 10l3.47 3.47a.75.75 0 1 1-1.06 1.06L10 11.06l-3.47 3.47a.75.75 0 0 1-1.06-1.06L8.94 10 5.47 6.53a.75.75 0 0 1 0-1.06Z"
            />
          </svg>
        </button>
      </div>

      <div class="grab" title="Drag to move" aria-hidden="true"></div>
      <div class="resize" aria-hidden="true"></div>
    </div>

    <script src="prompter.js"></script>
  </body>
</html>
